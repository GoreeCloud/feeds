name: Feeds Web CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 24.21.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Verify npm version
        run: test "$(npm --version)" = "11.19.0"
      - name: Install locked Development compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build Development modules
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/development.js
          test -f dist/protocol/capabilities.js
          test -f dist/protocol/articles.js
      - name: Validate Development protocol client
        run: npm run test:protocol
